[project]
name = "cat-ai-demo"
version = "0.1.0"
description = "LCCN -> concurrent cataloging assistants (subject suggest, LC call number, name reconciliation) over a WebSocket Lambda"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9",
    "google-genai>=2.25",
    "pydantic>=2.13",
    "httpx>=0.28",
    "pyyaml>=6",
    "pymarc>=5",
    "unidecode>=1.3",
    "requests>=2.32",
]

[dependency-groups]
dev = ["boto3>=1.35", "websockets>=13", "pytest>=8"]

[tool.uv]
package = false
